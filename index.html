<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🏴‍☠️ 海賊の秘宝</title>
<!-- Web フォント: タイトル=Pirata One / 見出し・数値=Cinzel(Decorative)。
     読み込めない環境ではシステムフォントにフォールバックする -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05090f;
    /* 深い海と、上方から差し込む霞んだ光。周辺は落として舞台を締める */
    background-image:
      radial-gradient(ellipse 70% 55% at 50% -8%, rgba(58,110,140,.55) 0%, rgba(20,44,66,.35) 40%, rgba(7,13,22,0) 72%),
      radial-gradient(ellipse 120% 100% at 50% 120%, rgba(6,10,18,.9) 0%, rgba(7,13,22,0) 60%),
      linear-gradient(180deg, #0c1826 0%, #070d16 60%, #04070c 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Cinzel", "Hiragino Kaku Gothic ProN", "Meiryo", serif;
    /* スクロールバーを出さない: キャンバスは常にビューポート内に収まるよう縮尺する */
    overflow: hidden;
    /* スマホ: 端で引っぱってもページごと揺れない(プルリフレッシュ等の抑止) */
    overscroll-behavior: none;
  }
  /* ページ背景を動かす: 巨大なぼかしラジアルを非常にゆっくり漂わせる */
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(38% 40% at 28% 30%, rgba(46,98,132,.22), transparent 70%),
      radial-gradient(44% 46% at 76% 62%, rgba(20,64,96,.20), transparent 70%),
      radial-gradient(48% 40% at 55% 12%, rgba(96,138,170,.15), transparent 72%);
    filter: blur(34px);
    animation: bgDrift 46s ease-in-out infinite alternate;
  }
  @keyframes bgDrift {
    0%   { transform: translate3d(-2%, -1%, 0) scale(1.05); }
    100% { transform: translate3d(3%, 2%, 0)   scale(1.13); }
  }
  h1 {
    font-family: "Pirata One", "Cinzel", serif;
    font-size: 52px;
    letter-spacing: 3px;
    margin: 20px 0 12px;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: titleFloat 6s ease-in-out infinite;
  }
  @keyframes titleFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  h1 .flag {
    -webkit-text-fill-color: initial;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
    font-size: 40px;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,.6));
  }
  h1 .title-text {
    /* 打ち出した真鍮の質感: 金のグラデ文字を横切る照り(シマー)が流れる */
    background: linear-gradient(100deg,
      #8a5a12 0%, #d9a53a 26%, #fff6d0 44%, #f0c040 56%, #b8860b 78%, #7a4d10 100%);
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #f0c040;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.55))
            drop-shadow(0 0 24px rgba(240,192,64,.4));
    animation: titleSheen 6.5s linear infinite;
  }
  @keyframes titleSheen {
    0%   { background-position: 190% 0; }
    100% { background-position: -50% 0; }
  }
  .stage-wrap {
    position: relative; display: inline-block; line-height: 0;
    /* ゲーム領域だけタッチのブラウザ既定動作(スクロール・ダブルタップズーム)を
       切る。ページ全体では切らないので、領域の外は普通に操作できる */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  #gameCanvas {
    border-radius: 16px;
    /* 甲板の枠: 真鍮の縁取り + 落ち影 + 内側の柔らかい照り。金の外周がゆっくり呼吸する */
    border: 1px solid rgba(210,168,96,.4);
    box-shadow:
      0 0 0 3px rgba(20,13,6,.92),
      0 0 0 4px rgba(160,118,58,.55),
      0 22px 65px rgba(0,0,0,.75),
      0 0 40px rgba(240,192,64,.10),
      inset 0 1px 14px rgba(255,230,180,.07);
    cursor: pointer;
    /* 画面が狭いときは縮めて全体が見えるようにする
       (CreateJS はマウス座標を CSS 表示サイズから換算するので狙いはズレない)。
       幅・高さの両方でビューポートに収め、スクロールバーを出さない。
       calc は 縦(100vh − タイトル/説明のぶん190px)を横比13:7に換算した上限。 */
    width: min(1500px, 98vw, calc((100dvh - 190px) * 13 / 7));
    height: auto;
    animation: frameGlow 8s ease-in-out infinite;
  }
  /* 右上のボタン列(真鍮の小ボタン): ⛶全画面 / 🔊消音 / ⚙設定。
     縦一列に並べる。タッチ端末では指で押せる大きさに拡大する(下の media) */
  .fs-btn {
    position: absolute; right: 10px; z-index: 5;
    width: 34px; height: 34px; padding: 0;
    font-size: 17px; line-height: 34px; text-align: center;
    color: #f4e2a0; cursor: pointer;
    background: linear-gradient(180deg, rgba(40,30,14,.72), rgba(16,11,5,.72));
    border: 1px solid rgba(210,168,96,.5); border-radius: 9px;
    box-shadow: 0 3px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,240,200,.12);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: background .15s, transform .1s, box-shadow .15s;
  }
  .fs-btn:hover { background: linear-gradient(180deg, rgba(60,44,18,.85), rgba(28,19,8,.85));
    box-shadow: 0 4px 16px rgba(0,0,0,.55), 0 0 14px rgba(240,192,64,.25); }
  .fs-btn:active { transform: scale(.94); }
  #fsBtn   { top: 10px; }
  #muteBtn { top: 56px; }
  #setBtn  { top: 102px; }
  /* 消音中はボタンを薄くして状態を一目で分かるようにする(絵文字も🔇へ替わる) */
  #muteBtn.muted { opacity: .55; }
  /* タッチ端末: 指の太さに合わせて 44px(推奨最小タッチターゲット)へ拡大。
     キャンバス内の ⏸ ボタンは hud.js がタッチ時に左へ寄せるので重ならない */
  @media (pointer: coarse) {
    .fs-btn {
      width: 44px; height: 44px; line-height: 44px; font-size: 20px;
      right: calc(8px + env(safe-area-inset-right));
    }
    #fsBtn   { top: 8px; }
    #muteBtn { top: 60px; }
    #setBtn  { top: 112px; }
    /* ---- タッチ端末の GPU 節約 ----
       blur(34px) の 150% サイズ固定レイヤーを transform で漂わせ続けると、
       GPU が毎フレーム巨大なぼかしテクスチャを再合成し、ゲームの真裏で
       休みなく発熱する。静止画にして filter も外す(ぼかし前提の淡い
       ラジアルなので opacity を少し下げれば見分けがつかない)。 */
    body::before { animation: none; filter: none; opacity: .7; }
    /* 枠の光アニメも停止(横持ち media は高さ条件付きなのでここでも指定) */
    #gameCanvas { animation: none; }
    /* backdrop-filter は背後のレイヤーを毎フレーム読み戻してぼかすため
       モバイルでは非常に高価。暗幕は濃くして視認性を補償する。 */
    .fs-btn, #setBack, p.hint { -webkit-backdrop-filter: none; backdrop-filter: none; }
    #setBack { background: rgba(4, 7, 12, .85); }
  }

  /* ---------- 設定パネル・操作説明(DOM 層) ----------
     キャンバスの上に重ねる真鍮枠のパネル。DOM なのでスライダーが素直に効き、
     背面の暗幕(#setBack)がクリックを吸うため、キャンバス側の
     「クリックで再開」等と衝突しない(input.js は無変更で済む)。 */
  #setBack {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(4, 7, 12, .72);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  #setPanel, #howtoPanel {
    position: absolute; z-index: 41;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(520px, 92%);
    max-height: 92%;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 18px 24px 20px;
    border-radius: 18px;
    border: 3px solid #f0c040;
    background: linear-gradient(180deg, #2a1f10, #150e06);
    box-shadow: 0 18px 60px rgba(0,0,0,.7), 0 0 34px rgba(240,192,64,.18),
                inset 0 1px 0 rgba(255,240,200,.12);
    color: #f7ecce;
    font-family: "Cinzel", "Hiragino Kaku Gothic ProN", "Meiryo", serif;
    line-height: normal;
    text-align: left;
  }
  #howtoPanel { z-index: 42; }
  .panel-title {
    margin: 0 0 14px; text-align: center;
    font-size: 22px; font-weight: 700; color: #f0c040; letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin: 12px 0; min-height: 34px;
  }
  .set-label { color: #caa96a; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .set-range { flex: 1; max-width: 240px; height: 28px; accent-color: #f0c040; }
  .set-note { margin: -6px 0 8px; color: #8a7a56; font-size: 12px; text-align: right; }
  .set-seg { display: flex; gap: 6px; }
  .seg-btn, .panel-btn {
    font-family: inherit; cursor: pointer;
    color: #f4e2a0; font-size: 14px; font-weight: 700;
    padding: 7px 14px; border-radius: 9px;
    background: linear-gradient(180deg, rgba(40,30,14,.9), rgba(16,11,5,.9));
    border: 1px solid rgba(210,168,96,.5);
    box-shadow: 0 3px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,240,200,.1);
    -webkit-tap-highlight-color: transparent;
  }
  .seg-btn.active {
    color: #1a1206;
    background: linear-gradient(180deg, #f6e6ac, #caa049);
    border-color: #f0c040;
    box-shadow: 0 0 12px rgba(240,192,64,.45);
  }
  .seg-btn:disabled, .panel-btn:disabled { opacity: .4; cursor: default; }
  .seg-btn:not(:disabled):active, .panel-btn:not(:disabled):active { transform: scale(.95); }
  .set-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .set-actions .panel-btn { flex: 1; padding: 10px 8px; font-size: 15px; }
  /* 操作説明: 実物のタッチボタン(.tbtn)と同じ見た目のアイコン + 説明文 */
  .howto-row { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
  .howto-ic {
    flex: 0 0 52px; height: 52px; border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: #f4e2a0;
    background: radial-gradient(circle at 50% 32%, rgba(60,44,18,.9), rgba(16,11,5,.9));
    border: 2px solid rgba(210,168,96,.55);
  }
  .howto-ic.fire {
    font-size: 13px; letter-spacing: 1px;
    border-color: rgba(240,160,96,.65);
    background: radial-gradient(circle at 50% 32%, rgba(96,40,16,.9), rgba(28,10,5,.9));
  }
  .howto-txt { font-size: 14.5px; line-height: 1.5; color: #e8dcc0; }
  .howto-ok { display: block; width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; }
  /* スマホ横持ち: 画面が低いのでパネルを詰めてスクロール可能にする */
  @media (pointer: coarse) and (max-height: 560px) {
    #setPanel, #howtoPanel { padding: 12px 18px 14px; }
    .panel-title { margin-bottom: 8px; font-size: 18px; }
    .set-row { margin: 8px 0; }
    .howto-row { margin: 7px 0; }
    .howto-ic { flex-basis: 42px; height: 42px; font-size: 18px; }
    .howto-ic.fire { font-size: 11px; }
  }
  /* 全画面時: ラップを黒く敷き、キャンバスを画面いっぱいに収める(比率維持) */
  .stage-wrap:fullscreen, .stage-wrap:-webkit-full-screen {
    width: 100vw; height: 100vh; background: #04070c;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-wrap:fullscreen #gameCanvas, .stage-wrap:-webkit-full-screen #gameCanvas {
    /* 比率(13:7)を保ったまま画面いっぱいまで拡大(黒でレターボックス) */
    width: min(100vw, calc(100vh * 13 / 7)); height: auto;
    max-width: 100vw; max-height: 100vh;
    border-radius: 0; box-shadow: none; animation: none;
  }
  @keyframes frameGlow {
    0%, 100% { box-shadow:
      0 0 0 3px rgba(20,13,6,.92), 0 0 0 4px rgba(160,118,58,.5),
      0 22px 65px rgba(0,0,0,.75), 0 0 34px rgba(240,192,64,.08),
      inset 0 1px 14px rgba(255,230,180,.06); }
    50%      { box-shadow:
      0 0 0 3px rgba(20,13,6,.92), 0 0 0 4px rgba(190,144,74,.7),
      0 22px 65px rgba(0,0,0,.75), 0 0 52px rgba(240,192,64,.20),
      inset 0 1px 14px rgba(255,230,180,.10); }
  }
  p.hint {
    color: #a7bccf;
    font-family: "Cinzel", "Hiragino Kaku Gothic ProN", "Meiryo", serif;
    font-size: 13.5px;
    line-height: 1.8;
    max-width: min(1100px, 92vw);
    text-align: center;
    margin: 16px auto 24px;
    padding: 13px 22px;
    background: linear-gradient(180deg, rgba(20,32,48,.5), rgba(10,16,26,.34));
    border: 1px solid rgba(150,180,210,.16);
    border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 8px 24px rgba(0,0,0,.35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  p.hint b { color: #f0c86a; font-weight: 700; }

  /* ---------- スマホ(横向き)対応 ----------
     タッチ端末で画面が低いとき(=スマホの横持ち)は、タイトルと説明文を隠して
     キャンバスに画面の高さを全部使わせる。論理解像度(1300x700)はそのままで、
     CSS の表示サイズだけを 13:7 の比率を保って画面にフィットさせる。 */
  @media (pointer: coarse) and (max-height: 560px) {
    h1, p.hint { display: none; }
    body { min-height: 100dvh; }
    .stage-wrap {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #gameCanvas {
      width: min(100vw, calc(100dvh * 13 / 7));
      max-height: 100dvh;
      border: none; border-radius: 0;   /* 枠ぶんの数pxでも画面からはみ出さない */
      box-shadow: none;
      animation: none;   /* 枠の光アニメはスマホでは負荷を減らすため止める */
    }
  }

  /* ---------- 携帯用の操作ボタン ----------
     タッチ端末だけに出す仮想ボタン。◀▶で大砲を移動、FIREで発射、⇄で玉を交換。
     半透明にして、下を通る大砲やアイテムが完全には隠れないようにする。 */
  #touchUI { display: none; }
  @media (pointer: coarse) {
    #touchUI { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 6; }
    .tbtn {
      pointer-events: auto; position: absolute;
      width: 72px; height: 72px; padding: 0; border-radius: 50%;
      font-size: 28px; line-height: 1; color: #f4e2a0;
      font-family: "Cinzel", "Meiryo", serif;
      background: radial-gradient(circle at 50% 32%, rgba(60,44,18,.55), rgba(16,11,5,.55));
      border: 2px solid rgba(210,168,96,.55);
      box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,240,200,.14);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    .tbtn:active {
      transform: scale(.92);
      background: radial-gradient(circle at 50% 32%, rgba(90,64,24,.75), rgba(30,20,8,.75));
      box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 0 16px rgba(240,192,64,.3);
    }
    #tLeft  { left: calc(64px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); }
    #tRight { left: calc(152px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); }
    .tbtn-swap {
      right: calc(122px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; font-size: 24px;
    }
    /* 🌈 虹玉ボタン(⇄ の左)。中身の「🌈2」(絵文字+残数)は hud.js が更新する。
       .suggest = 救済条件成立中の点滅提案 / .armed = 装填中 / .empty = 在庫切れ */
    .tbtn-wild {
      right: calc(192px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; font-size: 19px; font-weight: 800;
    }
    .tbtn-wild.armed { border-color: rgba(142,240,208,.85); color: #8ef0d0; }
    .tbtn-wild.empty { opacity: .45; }
    /* 🛡 パリィボタン(🌈 の左)。妖弾返しカードを取るまで hidden(hud.js が制御)。
       .cd = 構え直しのクールダウン中 / .active = 受付窓が開いている間 */
    .tbtn-parry {
      right: calc(262px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; font-size: 24px;
    }
    .tbtn-parry.cd { opacity: .45; }
    .tbtn-parry.active { border-color: rgba(142,240,208,.9); color: #8ef0d0; }
    .tbtn-wild.suggest { border-color: rgba(142,240,208,.9); }
    /* 点滅は box-shadow を補間せず(毎フレーム再ペイントになる)、静的な影を
       持つ ::after の opacity で明滅させる。opacity はコンポジタで完結する */
    .tbtn-wild.suggest::after {
      content: ""; position: absolute; inset: -6px; border-radius: 50%;
      box-shadow: 0 0 22px rgba(142,240,208,.85);
      animation: wildPulse .8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes wildPulse {
      0%, 100% { opacity: .25; }
      50%      { opacity: 1; }
    }
    .tbtn-fire {
      right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
      width: 96px; height: 96px; font-size: 21px; font-weight: 800; letter-spacing: 1px;
      border-color: rgba(240,160,96,.65);
      background: radial-gradient(circle at 50% 32%, rgba(96,40,16,.6), rgba(28,10,5,.6));
    }
    .tbtn-fire:active {
      background: radial-gradient(circle at 50% 32%, rgba(150,60,20,.8), rgba(50,18,8,.8));
      box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 0 20px rgba(255,140,60,.45);
    }
  }

  /* ---------- 縦向きの案内 ----------
     スマホを縦に持っているときは「横向きにしてね」と案内する(ゲームは止めない。
     回転するとメディアクエリが外れて自動的に消え、そのまま遊べる)。 */
  #rotateHint { display: none; }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotateHint {
      display: flex; position: fixed; inset: 0; z-index: 50;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; line-height: 1.9;
      background: rgba(4, 7, 12, .94);
      color: #f0c86a; font-size: 22px; font-weight: 700;
      font-family: "Cinzel", "Hiragino Kaku Gothic ProN", "Meiryo", serif;
    }
  }
</style>
</head>
<body>
  <!-- 見出し・案内文は id を付けて js/i18n.js が言語に応じて差し替える -->
  <h1><span class="flag">🏴‍☠️</span><span class="title-text" id="titleText">海賊の秘宝</span></h1>
  <div class="stage-wrap" id="stageWrap">
    <canvas id="gameCanvas" width="1300" height="700"></canvas>
    <button id="fsBtn" class="fs-btn" title="全画面表示 (F キー)" aria-label="全画面表示">⛶</button>
    <!-- 消音と設定(js/settings.js が配線する)。DOM ボタンなのでタッチ端末でも
         プレイ状態を問わず押せる(以前は M キーだけで、携帯では消音できなかった) -->
    <button id="muteBtn" class="fs-btn" title="消音の切り替え (M キー)" aria-label="消音の切り替え">🔊</button>
    <button id="setBtn" class="fs-btn" title="設定" aria-label="設定">⚙</button>
    <!-- 設定パネルと操作説明(中身は js/settings.js が言語に応じて組み立てる)。
         #stageWrap の中に置くので全画面表示でもそのまま見える -->
    <div id="setBack" hidden></div>
    <div id="setPanel" hidden></div>
    <div id="howtoPanel" hidden></div>
    <!-- 携帯用の操作ボタン(タッチ端末のみ CSS で表示)。
         DOM ボタンなので「◀ を押しながら FIRE」のような複数指の同時操作が自然に効く -->
    <div id="touchUI" aria-hidden="true">
      <button id="tLeft"  class="tbtn" tabindex="-1">◀</button>
      <button id="tRight" class="tbtn" tabindex="-1">▶</button>
      <button id="tSwap"  class="tbtn tbtn-swap" tabindex="-1">⇄</button>
      <button id="tWild"  class="tbtn tbtn-wild" tabindex="-1">🌈</button>
      <button id="tParry" class="tbtn tbtn-parry" tabindex="-1" hidden>🛡</button>
      <button id="tFire"  class="tbtn tbtn-fire" tabindex="-1">FIRE</button>
    </div>
  </div>
  <!-- スマホ縦持ちのときだけ CSS(orientation: portrait)で表示される案内 -->
  <div id="rotateHint">📱 端末を横向きにしてください<br>この海賊船は横長の海でしか戦えません</div>
  <p class="hint" id="hintText">マウスで大砲を左右に移動、クリックで真上に発射!右クリックか Space で玉を交換。<b>Q キーか画面の 🌈 ボタンで虹玉(万能玉)を装填</b>。💎 で「妖弾返し」を取れば <b>Shift キーか 🛡 ボタン</b>で敵弾をパリィ!落ちてくる宝やパワーアップは大砲でキャッチ!<br>BGM と効果音は最初のクリックで鳴り始めます(M キーで消音)。<br>🛠 <b>E キー</b>か下のボタンで<b>コースエディタ</b>を開いて、自分だけの航路を作れます。</p>

  <!-- CreateJS は lib/ に同梱してセルフホストする。CDN への同期読み込みは
       「別サーバーへの接続が終わるまで起動が止まる」うえ、CDN が落ちると
       ゲームごと起動しない単一障害点だった。同一オリジンなら GitHub Pages の
       1接続で全部届き、オフラインの教室でも動く。万一読めなければ CDN を試す -->
  <script src="lib/createjs.min.js"></script>
  <script>
    if (typeof createjs === "undefined") {
      document.write('<script src="https://code.createjs.com/1.0.0/createjs.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof createjs === "undefined") {
      document.body.innerHTML =
        '<h1 style="color:#f0c040">CreateJS の読み込みに失敗しました / Failed to load CreateJS</h1>' +
        '<p style="color:#8aa4be">インターネット接続を確認してから再読み込みしてください。<br>' +
        'Check your internet connection and reload the page.</p>';
    }
  </script>
  <!-- StageGL(WebGL 描画)へ加算合成 "lighter" を教えるパッチ。
       CreateJS の読み込み確定後・ゲームコードより前に当てる。
       Canvas 2D で動くとき(フォールバック時)は何もしない(gl-patch.js 冒頭参照) -->
  <script src="js/gl-patch.js"></script>
  <!-- 依存順に読み込む(i18n が文言辞書を用意し、config がデータ定義でそれを引き、
       main が起動する。i18n は必ず config より前) -->
  <script src="js/i18n.js"></script>
  <!-- 設定の保存(PP.store)。audio.js が読み込み時に音量を復元するため最上流で読む -->
  <script src="js/store.js"></script>
  <script src="js/config.js"></script>
  <!-- コース API / エディタで共有する純粋なデータ操作 -->
  <script src="js/course-utils.js"></script>
  <script src="js/background.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/rail.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/chain.js"></script>
  <script src="js/powerups.js"></script>
  <script src="js/cannon.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/crisis.js"></script>
  <!-- 【強化】宝玉の力(ローグライト強化)+ 手詰まり救済。main より先に読む -->
  <script src="js/upgrades.js"></script>
  <script src="js/gameover.js"></script>
  <script src="js/course-view.js"></script>
  <!-- ボス戦(クラーケンの海域)。main より先に読む(startLevel が PP.boss を呼ぶ) -->
  <script src="js/boss.js"></script>
  <script src="js/skull.js"></script>
  <!-- 入力イベントを main のゲーム進行から分離。main の初期化時に接続する -->
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <!-- ポーズ機能(main の後: PP.game / PP.hud / PP.audio を使う) -->
  <script src="js/pause.js"></script>
  <!-- 設定パネル・消音ボタン・操作説明(pause の後: PP.pauseCtl を使う) -->
  <script src="js/settings.js"></script>
  <!-- コース自作 API とビジュアルエディタ(main の後: PP.stage / PP.playCourse を使う)。
       ゲーム本体の起動には不要な約 120KB なので defer で後回しにする
       (defer どうしは記述順に実行されるので course-api → editor → my-course の
        依存順はそのまま保たれる) -->
  <script src="js/course-api.js" defer></script>
  <script src="js/editor.js" defer></script>
  <!-- 【課題3】エディタで作った自作コースの登録(course-api の後に読む) -->
  <script src="js/my-course.js" defer></script>
  <!-- Web フォントが遅れて届いた場合、キャンバスの文字を1回描き直して反映させる -->
  <script>
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        // cache() で焼いた装飾フォントの Text は自動では届いたフォントに
        // 差し替わらないので、登録簿(config.js)経由で一度だけ焼き直す
        if (window.PP && PP.refreshFontCaches) PP.refreshFontCaches();
        if (window.PP && PP.stage) PP.stage.update();
      });
    }
  </script>
  <!-- 全画面表示(F キー / 右上ボタン)とモバイル横向き固定 -->
  <script src="js/fullscreen.js"></script>
</body>
</html>
